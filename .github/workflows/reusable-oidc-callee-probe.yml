name: Reusable OIDC callee identity probe
on:
  workflow_call:
permissions:
  id-token: write
  contents: none
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Decode selected OIDC identity claims
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-vdp-owned-reusable-oidc-probe")"
          OIDC_RESPONSE="$response" python3 - <<'PY'
          import base64, json, os
          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keys = ["sub", "repository", "repository_id", "repository_owner", "repository_owner_id", "job_workflow_ref", "job_workflow_sha", "ref", "sha", "event_name", "actor"]
          print("REUSABLE_OIDC_IDENTITY_PROOF=" + json.dumps({key: claims.get(key) for key in keys}, sort_keys=True))
          PY
