    inputs:
      run_id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  call-reader:
    uses: milrnacni101/vdp-lock-action-20261015/.github/workflows/artifact-isolation-reader.yml@main
    with:
      run_id: ${{ inputs.run_id }}
